<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Princeton SuperAlignment research group."
    >
    <title>Princeton SuperAlignment</title>
    <style>
      body {
        background-color: #000;
        padding: 50px;
        font: 14px/1.5 "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #ddd;
        font-weight: 400;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: #fff;
        margin: 0 0 20px;
      }

      h1,
      h2,
      h3 {
        line-height: 1.1;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        color: #fff;
      }

      p,
      ul {
        margin: 0 0 20px;
      }

      a {
        color: #8cc8ff;
        text-decoration: none;
      }

      a:hover,
      a:focus {
        color: #c6e3ff;
      }

      strong {
        color: #fff;
        font-weight: 700;
      }

      img {
        max-width: 100%;
      }

      .wrapper {
        width: min(100%, 760px);
        margin: 0 auto;
      }

      header {
        width: 100%;
        -webkit-font-smoothing: subpixel-antialiased;
      }

      header h1 a {
        color: #fff;
      }

      .site-title {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .logo {
        display: block;
        width: min(100%, 560px);
        margin: 0 auto 28px;
      }

      .group-photo {
        display: block;
        margin: 0 0 20px;
        width: 760px;
      }

      .navigation {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
      }

      .navigation span a {
        display: inline-block;
        padding: 0.4em 1em;
        border: 1px solid #333;
        border-radius: 4px;
        text-decoration: none;
        color: #8cc8ff;
        font-size: 0.95em;
        transition: background-color 0.15s, border-color 0.15s;
      }

      .navigation span a:hover,
      .navigation span a:focus {
        background-color: #267cb9;
        color: #fff;
        border-color: #267cb9;
      }

      @media print, screen and (max-width: 960px) {
        .wrapper {
          width: auto;
          margin: 0;
        }

        header {
          width: auto;
        }
      }

      @media print, screen and (max-width: 720px) {
        body {
          word-wrap: break-word;
        }

        header {
          padding: 0;
        }
      }

      @media print, screen and (max-width: 480px) {
        body {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1 class="site-title"><a href="./">Princeton SuperAlignment</a></h1>
        <img
          class="logo"
          src="assets/psa.png"
          alt="Princeton SuperAlignment"
        >
        <img
          class="group-photo"
          src="assets/princeton-superalignment.jpg"
          alt="Princeton SuperAlignment group photo"
        >
        <div class="navigation" aria-label="Primary navigation">
          <span><a href="index.html">Home</a></span>
          <span><a href="research.html">Research</a></span>
        </div>
      </header>
    </div>
  </body>
</html>
